# SciGraph AI - Tabular Baselines Configuration

logistic_regression:
  C: 1.0
  max_iter: 1000
  solver: "lbfgs"
  random_state: 42

xgboost:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

features:
  numerical:
    - "historical_citation_count_at_cutoff"
    - "author_count"
    - "institution_count"
    - "referenced_works_count"
    - "abstract_word_count"
  categorical:
    - "primary_topic_id"
    - "primary_institution_country"
